[project]
name = "indicSSL"
version = "0.1.0"
description = "IndicSSL comparative study"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=5.0.0",
    "huggingface-hub>=1.21.0",
    "lejepa",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "soundfile>=0.14.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "torchcodec>=0.14.0",
    "tqdm>=4.68.3",
    "transformers>=5.12.1",
    "wandb>=0.28.0",
]

[dependency-groups]
dev = [
    "build>=1.4.2",
    "hatchling>=1.29.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.2",
    "ruff>=0.15.8",
    "twine>=6.2.0",
    "zenodo-get>=3.0.3",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchaudio = [{ index = "pytorch-cu124" }]
lejepa = { git = "https://github.com/galilai-group/lejepa" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.hatch.build.hooks.custom]
[tool.hatch.build.targets.wheel]

[tool.uv]
package = true
