data:
    value:
        batch_size: 64
        clip_duration: 5
        dataset_path: ./cache/indicvoices
        frame_to_hop_ratio: 2.5
        n_mels: 128
        n_time_bins: 256
        num_workers: 4
        sample_rate: 16000
logging:
    value:
        run_name: null
        wandb_entity: null
        wandb_project: sync-JEPA
masking:
    value:
        mask_ratio_max: 0.6
        mask_ratio_min: 0.4
        strategy: random
model:
    value:
        depth: 12
        embed_dim: 384
        mlp_ratio: 4
        num_heads: 6
        patch_size: 16
        predictor_depth: 6
        predictor_embed_dim: 192
        predictor_num_heads: 6
optimizer:
    value:
        betas:
            - 0.9
            - 0.95
        gradient_clip: 1
        lr: 0.0003
        type: adamw
        weight_decay: 0.05
paths:
    value:
        checkpoint_dir: ./checkpoints
        data_dir: ./data
        log_dir: ./logs
schedule:
    value:
        decay: cosine
        ema_tau_end: 1
        ema_tau_start: 0.996
        total_steps: 50000
        warmup_start_lr: 1e-06
        warmup_steps: 1000
training:
    value:
        checkpoint_every: 5000
        log_every: 100
        max_steps: 50000
        precision: bf16
        seed: 2
