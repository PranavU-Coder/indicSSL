downstream_expert:
  datarc:
    eval_batch_size: 1
    file_path: /home/pranav/Projects/indicJEPA/data/kb_data_clean_wav
    max_timestep: 192000
    num_workers: 16
    train_batch_size: 128
  modelrc:
    UtteranceLevel:
      pooling: MeanPooling
    projector_dim: 128
    select: UtteranceLevel
